// app/build.gradle — the :app module build configuration.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.jnialert'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.jnialert"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // NDK / CMake configuration for native code.
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    // Point to the CMakeLists.txt that builds libnative-alert.so.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
